name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Het token van deze workflow mag alleen lezen. Dat is nu ook de standaard van de
# organisatie, maar expliciet blijft het staan als die standaard ooit verandert.
permissions:
  contents: read

jobs:
  # De bron en de repo-structuur, via de herbruikbare org-workflow.
  paden:
    uses: security-commons-nl/.github/.github/workflows/python-ci.yml@main
    with:
      python-version: "3.12"
      test-command: "python -m pytest tests/ -v"
      install-extras: "pytest jsonschema"

  # De app: bouwen en in een echte browser doorlopen. De browsertests vergelijken de uitslag met
  # tools/score.py en met de zelfcheck waar de bron uit komt, dus hier valt het door de mand als de
  # app en de bron uit elkaar lopen.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installeren
        run: |
          python -m pip install --upgrade pip
          pip install pytest jsonschema playwright
          python -m playwright install --with-deps chromium

      - name: Bouwen
        run: python check/bouw.py

      - name: Tests
        run: python -m pytest check/tests/ -v

      - name: De gebouwde check bewaren
        uses: actions/upload-artifact@v4
        with:
          name: zelfcheck
          path: check/dist/index.html
          if-no-files-found: error

  # De crosswalk: de mapping van barrieres naar normenkaders, en de pagina eromheen. De
  # browsertests vergelijken wat op het scherm staat met tools/mappingen.py, dus hier valt het door
  # de mand als de pagina en de mapping uit elkaar lopen.
  #
  # De kennisbank wordt erbij uitgecheckt, want die is de bron van het handelingsperspectief: daar
  # staat in de frontmatter van elk item bij welke barrieres het hoort. Zonder die checkout slaat de
  # vergelijking over en zou een hernoemd of ontkoppeld item stil een dode verwijzing opleveren. Hij
  # gaat naar _kennisbank en niet naar ../kennisbank, want een checkout buiten de workspace wordt
  # geweigerd.
  mappingen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/checkout@v6
        with:
          repository: security-commons-nl/kennisbank
          path: _kennisbank

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installeren
        run: |
          python -m pip install --upgrade pip
          pip install pytest jsonschema playwright
          python -m playwright install --with-deps chromium

      # De kennisbank is de bron van de koppeling barriere -> handleiding. Loopt de kopie hier
      # achter, dan belooft de site een handleiding die er niet (meer) zo staat.
      - name: Handelingsperspectief loopt gelijk met de kennisbank
        run: python tools/haal_handelingsperspectief.py --check

      - name: Bouwen
        run: python mappingen/bouw.py

      - name: Tests
        run: python -m pytest mappingen/tests/ tests/test_handelingsperspectief.py -v

      - name: De gebouwde crosswalk bewaren
        uses: actions/upload-artifact@v4
        with:
          name: crosswalk
          path: mappingen/dist/index.html
          if-no-files-found: error
