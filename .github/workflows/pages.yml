name: Publiceren op Pages

# De zelfcheck is één zelfstandig HTML-bestand. Dat bestand is tegelijk de site en de download:
# wie hem offline wil draaien, slaat de pagina op en heeft alles.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bouwen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Bouwen
        run: |
          python check/bouw.py site
          test -s site/index.html
          # Dezelfde pagina ook als download onder een sprekende naam.
          cp site/index.html site/zelfcheck-aanvalspaden.html
          cp paden.json site/paden.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publiceren:
    needs: bouwen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
