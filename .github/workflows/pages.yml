name: Publiceren op Pages

# De zelfcheck is één zelfstandig HTML-bestand. Dat bestand is tegelijk de site en de download:
# wie hem offline wil draaien, slaat de pagina op en heeft alles.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bouwen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Bouwen
        run: |
          python check/bouw.py site
          test -s site/index.html
          # Dezelfde pagina ook als download onder een sprekende naam.
          cp site/index.html site/zelfcheck-aanvalspaden.html
          cp paden.json site/paden.json
          # De crosswalk staat een niveau dieper, met de mapping als download ernaast.
          python mappingen/bouw.py site/normen
          test -s site/normen/index.html
          cp site/normen/index.html site/normen/van-aanvalspad-naar-norm.html
          cp mappingen/bio2.json mappingen/wpg.json site/normen/
          # De meting: dezelfde vorm, met de meetregels als download ernaast.
          python meting/bouw.py site/meting
          test -s site/meting/index.html
          cp site/meting/index.html site/meting/meting-aanvalspaden.html
          cp meting/regels.json site/meting/regels.json
          # De AI-hulp: opt-in, eigen pagina, eigen CSP. Wie hem niet opent, merkt er niets van.
          python meting/ai/bouw.py site/meting/ai
          test -s site/meting/ai/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  publiceren:
    needs: bouwen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
